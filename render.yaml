# Render Blueprint: one Docker web service serving the API and the web UI.
services:
  - type: web
    name: gridwise-llm
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free             # sleeps after 15 min idle: keep awake with an external /health pinger; switch to starter for judging
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false        # entered in the Render dashboard, never committed
